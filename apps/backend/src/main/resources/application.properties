# Server Configuration
server.port=${PORT:5001}

# Use virtual threads for Spring MVC request handling. Socket.IO runs on its
# own Netty event loops and is intentionally unaffected by this setting.
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}

server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:1000}

# Database Configuration
# Spring Boot 4: connection settings moved from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=false
app.mongodb.pool.max-size=${MONGO_POOL_MAX_SIZE:40}
app.mongodb.pool.min-size=${MONGO_POOL_MIN_SIZE:5}
app.mongodb.pool.max-wait-ms=${MONGO_POOL_MAX_WAIT_MS:1000}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Socket Redis: Socket.IO pub/sub/store and distributed socket state.
socketio.redis.host=${SOCKET_REDIS_HOST:${REDIS_HOST:localhost}}
socketio.redis.port=${SOCKET_REDIS_PORT:${REDIS_PORT:6379}}
socketio.redis.username=${SOCKET_REDIS_USERNAME:${REDIS_USERNAME:}}
socketio.redis.password=${SOCKET_REDIS_PASSWORD:${REDIS_PASSWORD:}}
socketio.redis.database=${SOCKET_REDIS_DATABASE:${REDIS_DATABASE:0}}
socketio.redis.ssl.enabled=${SOCKET_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}

# Cache Redis: disposable lookup/count/recent-message caches.
app.cache.redis.host=${CACHE_REDIS_HOST:${REDIS_HOST:localhost}}
app.cache.redis.port=${CACHE_REDIS_PORT:${REDIS_PORT:6379}}
app.cache.redis.username=${CACHE_REDIS_USERNAME:${REDIS_USERNAME:}}
app.cache.redis.password=${CACHE_REDIS_PASSWORD:${REDIS_PASSWORD:}}
app.cache.redis.database=${CACHE_REDIS_DATABASE:${REDIS_DATABASE:0}}
app.cache.redis.ssl.enabled=${CACHE_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}

app.session.store=${SESSION_STORE:redis}
app.session.redis.key-prefix=${SESSION_REDIS_KEY_PREFIX:chat:session:user:}
app.session.redis.ttl=${SESSION_REDIS_TTL:30m}
app.rate-limit.store=${RATE_LIMIT_STORE:redis}
app.rate-limit.redis.key-prefix=${RATE_LIMIT_REDIS_KEY_PREFIX:chat:rate-limit:}
app.recent-message.cache.key-prefix=${RECENT_MESSAGE_CACHE_KEY_PREFIX:chat:recent-message-count:}
app.recent-message.cache.ttl=${RECENT_MESSAGE_CACHE_TTL:5s}
app.room-message.cache.key-prefix=${ROOM_MESSAGE_CACHE_KEY_PREFIX:chat:room:}
app.room-message.cache.max-size=${ROOM_MESSAGE_CACHE_MAX_SIZE:15}
app.room-message.cache.ttl=${ROOM_MESSAGE_CACHE_TTL:3m}
app.room-message.cache.empty-ttl=${ROOM_MESSAGE_CACHE_EMPTY_TTL:30s}
app.chat-lookup.cache.user-key-prefix=${CHAT_LOOKUP_USER_KEY_PREFIX:chat:lookup:user:}
app.chat-lookup.cache.room-key-prefix=${CHAT_LOOKUP_ROOM_KEY_PREFIX:chat:lookup:room:}
app.chat-lookup.cache.ttl=${CHAT_LOOKUP_CACHE_TTL:5m}
app.chat-lookup.cache.negative-ttl=${CHAT_LOOKUP_NEGATIVE_CACHE_TTL:15s}
socketio.store.type=${SOCKETIO_STORE_TYPE:redis}
socketio.store.redis.data-key-prefix=${SOCKETIO_REDIS_DATA_KEY_PREFIX:chat:socketio:data:}
socketio.store.redis.connection-pool-size=${SOCKETIO_REDIS_CONNECTION_POOL_SIZE:16}
socketio.store.redis.subscription-pool-size=${SOCKETIO_REDIS_SUBSCRIPTION_POOL_SIZE:8}

# Single-instance authentication spike protection
app.auth.max-concurrent-requests=${AUTH_MAX_CONCURRENT_REQUESTS:8}
app.auth.user-cache.maximum-size=${AUTH_USER_CACHE_MAX_SIZE:20000}
app.auth.user-cache.ttl=${AUTH_USER_CACHE_TTL:15m}
app.auth.negative-cache.maximum-size=${AUTH_NEGATIVE_CACHE_MAX_SIZE:5000}
app.auth.negative-cache.ttl=${AUTH_NEGATIVE_CACHE_TTL:1m}
app.auth.redis.enabled=${AUTH_REDIS_CACHE_ENABLED:false}
app.auth.redis.user-key-prefix=${AUTH_REDIS_USER_KEY_PREFIX:chat:auth:user:}
app.auth.redis.missing-key-prefix=${AUTH_REDIS_MISSING_KEY_PREFIX:chat:auth:missing:}

# File Upload Configuration
# Storage type: local or s3 (default: local)
file.storage.type=${FILE_STORAGE_TYPE:local}
file.upload-dir=./uploads
app.aws.region=${AWS_REGION:ap-northeast-2}
app.aws.s3.bucket=${S3_BUCKET_NAME:ktb-004-chat-storage}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# Security Configuration
app.encryption.key=${ENCRYPTION_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.encryption.salt=${ENCRYPTION_SALT:3132333435363738}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}

# Socket.IO Server Configuration
socketio.server.host=0.0.0.0
socketio.server.port=${WS_PORT:5002}
socketio.server.origin=${SOCKETIO_SERVER_ORIGIN:*}
socketio.server.accept-backlog=${SOCKETIO_ACCEPT_BACKLOG:200}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ktb.chatapp=INFO
logging.level.org.mongodb=INFO
logging.level.com.ktb.chatapp.config.RequestLoggingFilter=${REQUEST_LOG_LEVEL:WARN}
logging.level.com.ktb.chatapp.config.SecurityConfig=${SECURITY_CONFIG_LOG_LEVEL:ERROR}

# Content Moderation
chatapp.banned-word.location=classpath:fake_banned_words_10k.txt

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.packages-to-scan=com.ktb.chatapp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=read-only
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name:ktb-chat-backend}
management.metrics.tags.host=${HOSTNAME:unknown}

name: Backend CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-cd.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing backend image tag. Defaults to the current commit SHA."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-production
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME || format('{0}-backend', github.event.repository.name) }}
  BACKEND_DEPLOY_HOSTS: ${{ vars.BACKEND_DEPLOY_HOSTS }}
  BACKEND_CONTAINER_NAME: ${{ vars.BACKEND_CONTAINER_NAME || 'ktb-chat-backend' }}
  BACKEND_ENV_FILE: ${{ vars.BACKEND_ENV_FILE || '/home/ubuntu/ktb-chat-backend/.env' }}
  BACKEND_PORTS: ${{ vars.BACKEND_PORTS || '-p 5001:5001 -p 5002:5002' }}
  BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'http://localhost:5001/api/health' }}
  BACKEND_SYSTEMD_SERVICE: ${{ vars.BACKEND_SYSTEMD_SERVICE || 'ktb-backend.service' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment config
        run: |
          test -n "$BACKEND_IMAGE_NAME" || { echo "BACKEND_IMAGE_NAME variable is required"; exit 1; }
          test -n "${{ secrets.GHCR_USERNAME }}" || { echo "GHCR_USERNAME secret is required"; exit 1; }
          test -n "${{ secrets.GHCR_TOKEN }}" || { echo "GHCR_TOKEN secret is required"; exit 1; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            test -n "$BACKEND_DEPLOY_HOSTS" || { echo "BACKEND_DEPLOY_HOSTS variable is required"; exit 1; }
            test -n "$DEPLOY_USER" || { echo "DEPLOY_USER variable is required"; exit 1; }
            test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo "DEPLOY_SSH_KEY secret is required"; exit 1; }
          fi

      - name: Resolve image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            image_tag="${{ inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            image_tag="pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}"
          else
            image_tag="${GITHUB_SHA}"
          fi

          image_owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image_name="$(printf '%s' "${BACKEND_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          image_uri="${GHCR_REGISTRY}/${image_owner}/${image_name}:${image_tag}"
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "Backend image: ${image_uri}"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.uri }}

      - name: Set up SSH
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          hosts="$(printf '%s' "$BACKEND_DEPLOY_HOSTS" | tr -d '\r' | xargs)"
          for host in $hosts; do
            ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          done

      - name: Deploy over SSH
        if: github.event_name != 'pull_request'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          remote_script="$(mktemp)"
          cat > "$remote_script" <<'SCRIPT'
          set -euo pipefail
          if [ -n "$SYSTEMD_SERVICE" ]; then
            sudo systemctl stop "$SYSTEMD_SERVICE" 2>/dev/null || true
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          docker pull "$IMAGE_URI"
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true
          env_file_arg=()
          if [ -n "$ENV_FILE" ]; then
            env_file_arg=(--env-file "$ENV_FILE")
          fi
          read -r -a port_args <<< "$PORTS"
          docker run -d --name "$CONTAINER_NAME" --restart unless-stopped "${env_file_arg[@]}" "${port_args[@]}" "$IMAGE_URI"
          for i in $(seq 1 30); do
            curl -fsS "$HEALTH_URL" >/dev/null && exit 0
            sleep 2
          done
          docker logs --tail 100 "$CONTAINER_NAME"
          exit 1
          SCRIPT

          hosts="$(printf '%s' "$BACKEND_DEPLOY_HOSTS" | tr -d '\r' | xargs)"
          for host in $hosts; do
            echo "Deploying backend to $host"
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$host" \
              "IMAGE_URI='$IMAGE_URI' CONTAINER_NAME='$BACKEND_CONTAINER_NAME' ENV_FILE='$BACKEND_ENV_FILE' PORTS='$BACKEND_PORTS' HEALTH_URL='$BACKEND_HEALTH_URL' SYSTEMD_SERVICE='$BACKEND_SYSTEMD_SERVICE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' bash -s" < "$remote_script"
          done

          rm -f "$remote_script"
